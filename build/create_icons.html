<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Generate ReplyCators Icons</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; background: #1a1d21; color: #e5e7eb; }
    h1 { font-size: 18px; margin-bottom: 16px; }
    .icon-row { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; margin-bottom: 24px; }
    canvas { display: block; border-radius: 8px; }
    p { font-size: 12px; color: #8b949e; margin-top: 8px; }
    .instruction { background: #222529; border: 1px solid #3a3d42; border-radius: 8px; padding: 16px; font-size: 13px; }
    code { background: #313438; padding: 2px 6px; border-radius: 4px; color: #4f8ef7; }
  </style>
</head>
<body>
  <h1>ReplyCators — Icon Generator</h1>
  <p class="instruction">
    Right-click each canvas → <strong>Save image as...</strong><br/>
    Save to <code>assets/icons/</code> as <code>icon16.png</code>, <code>icon48.png</code>, <code>icon128.png</code>
  </p>
  <div class="icon-row" id="icon-row"></div>

  <script>
    const sizes = [16, 48, 128];
    const row = document.getElementById('icon-row');

    sizes.forEach(size => {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      canvas.title = `icon${size}.png — right-click to save`;

      const ctx = canvas.getContext('2d');

      // Background
      const grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, '#0969da');
      grad.addColorStop(1, '#7c3aed');
      ctx.fillStyle = grad;
      const r = size * 0.15;
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(size - r, 0);
      ctx.quadraticCurveTo(size, 0, size, r);
      ctx.lineTo(size, size - r);
      ctx.quadraticCurveTo(size, size, size - r, size);
      ctx.lineTo(r, size);
      ctx.quadraticCurveTo(0, size, 0, size - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
      ctx.fill();

      // Letter RC
      ctx.fillStyle = '#ffffff';
      if (size >= 48) {
        ctx.font = `bold ${Math.floor(size * 0.38)}px -apple-system, Segoe UI, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('RC', size / 2, size / 2 + size * 0.04);
      } else {
        ctx.font = `bold ${Math.floor(size * 0.55)}px -apple-system, Segoe UI, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('R', size / 2, size / 2 + size * 0.04);
      }

      const div = document.createElement('div');
      div.innerHTML = `<p style="font-size:11px;color:#8b949e;text-align:center;margin-bottom:6px;">${size}×${size}</p>`;
      div.appendChild(canvas);
      div.innerHTML += `<p style="font-size:10px;color:#656d76;text-align:center;">icon${size}.png</p>`;
      row.appendChild(div);
    });
  </script>
</body>
</html>

name: Governance - Documentation Audit

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  issues: write

jobs:
  documentation-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract prompt from prompt catalog
        id: prompt
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          title = '### Documentation - Documentation Alignment and Maintenance'
          catalog = Path('docs/PROMPT-CATALOG.md').read_text(encoding='utf-8')
          idx = catalog.find(title)
          if idx < 0:
            raise SystemExit('Prompt not found in docs/PROMPT-CATALOG.md')

          tail = catalog[idx + len(title):]
          end = tail.find('\n### ')
          body = tail[:end] if end >= 0 else tail
          body = body.strip()

          out_path = Path('.governance/prompts/documentation-audit.md')
          out_path.parent.mkdir(parents=True, exist_ok=True)
          out_path.write_text(body + '\n', encoding='utf-8')

          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as fh:
            fh.write(f"prompt_path={out_path.as_posix()}\n")
          PY

      - name: Invoke Copilot Agent for documentation audit
        uses: github-copilot/agent@v1
        with:
          problem-statement: |
            Use the exact prompt text in `${{ steps.prompt.outputs.prompt_path }}` from `docs/PROMPT-CATALOG.md`.
            Return a strict JSON array of findings in `.governance/findings/documentation-findings.json`.
            Set `source` to `documentation` for all findings.

      - name: Validate documentation findings
        run: node .github/scripts/governance-safeguards.js .governance/findings/documentation-findings.json documentation .governance/findings/documentation-validated.json

      - name: Process documentation findings into issues
        run: node .github/scripts/process-findings.js .governance/findings/documentation-validated.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Prioritize governance issues
        run: node .github/scripts/prioritize-issues.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Upload documentation audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: governance-documentation-audit
          path: .governance/findings/
          if-no-files-found: warn

name: ReplyCators CI

# ─────────────────────────────────────────────────────────────────────────────
# CI ENVIRONMENT NOTE — Runtime-First Policy Exception
#
# The Runtime-First Policy (AGENTS.md § 13-A) applies to LOCAL and AGENT
# workflows on C:\Work\Bob.  GitHub Actions runners are EPHEMERAL environments:
# no C:\Work\Bob\Runtime directory exists on a runner.  Therefore, jobs here
# correctly run "npm ci" to install dependencies into the ephemeral workspace.
#
# This is the ONLY context where running npm ci / npm install inside the
# repository directory is acceptable WITHOUT Runtime-first evaluation.
#
# For local/agent workflows: always check C:\Work\Bob\Runtime\NodeJS first.
# Authoritative dependency store: C:\Work\Bob\Runtime\NodeJS\node_modules
# ─────────────────────────────────────────────────────────────────────────────
#
# AUTOMATED TESTING NOTE
# Automated testing infrastructure has been intentionally removed while
# ReplyCators is under active pre-release development (see AGENTS.md § 26
# and TD-003). The test job has been removed. Validation is manual QA only
# until the first stable release.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, master, develop, 'release/**', 'feature/**']
  pull_request:
    branches: [main, master, develop]

jobs:
  # ── Job 1: Type-check TypeScript source ──────────────────────────────────────
  typecheck:
    name: TypeScript Type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # CI EXCEPTION: ephemeral runner has no Runtime directory. npm ci is correct here.
        # For local/agent workflows: use C:\Work\Bob\Runtime\NodeJS instead.
        run: npm ci

      - name: Run TypeScript type-check
        run: npm run typecheck

  # ── Job 2: Webpack Build ──────────────────────────────────────────────────────
  build:
    name: Webpack Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # CI EXCEPTION: ephemeral runner has no Runtime directory. npm ci is correct here.
        # For local/agent workflows: use C:\Work\Bob\Runtime\NodeJS instead.
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Verify dist/ sync (root → dist/)
        run: npm run sync:verify

      - name: Upload dist/ artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # ── Job 3: Sync Verification (root ↔ dist/) ──────────────────────────────────
  sync-check:
    name: Root ↔ dist/ Sync Check
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify root and dist/ are in sync
        # dist/ is committed to the repo, so we check it directly without a build.
        # No npm ci needed here — sync-root.js uses only Node built-ins (fs, path).
        run: node build/sync-root.js --verify

name: Scheduled Automated Issue Remediation

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate an implementation without changing GitHub or pushing to main'
        required: false
        type: boolean
        default: false
      issue_number:
        description: 'Process one eligible issue number (optional)'
        required: false
        type: string
      max_issues:
        description: 'Maximum eligible issues to process'
        required: false
        type: choice
        options:
          - '1'
          - '2'
          - '3'
        default: '1'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.repository }}-daily-issue-remediation-main
  cancel-in-progress: false

jobs:
  remediate:
    name: Validate, implement, and integrate verified issues
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm

      - name: Validate remediation eligibility policy
        run: node .github/scripts/tests/remediation-label-policy.test.js

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Configure automation identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Process eligible auto-fix issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.REMEDIATION_MODEL || 'gpt-5.4' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          ISSUE_NUMBER: ${{ inputs.issue_number || '' }}
          MAX_ISSUES: ${{ inputs.max_issues || '1' }}
        run: node .github/scripts/remediate-issues.js
